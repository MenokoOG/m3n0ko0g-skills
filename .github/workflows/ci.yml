name: ci

on:
  push:
  pull_request:

jobs:
  test:
    name: node ${{ matrix.node }} / python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["18", "20", "22"]
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # No npm install. There are no dependencies, and CI proves it.
      - name: skills are packaged and current
        run: npm run check:skills

      - name: MCP server speaks the protocol
        run: npm run test:mcp

      - name: scouts find every planted defect
        run: npm run test:scouts
